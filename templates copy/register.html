<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Register - AI Career Platform</title>
    <style>
        * { box-sizing: border-box; font-family: 'Segoe UI', sans-serif; margin: 0; padding: 0; }
        body {
            background: #14313f;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        .card {
            background: white;
            padding: 40px;
            border-radius: 8px;
            width: 400px;
        }
        .card h2 { color: #14313f; font-size: 26px; }
        .card .sub { color: #5d6f78; font-size: 13px; margin: 4px 0 10px; }

        label { display: block; font-weight: 600; font-size: 13px; color: #3d4f58; margin-top: 15px; }
        input, select {
            width: 100%; padding: 12px; margin-top: 6px;
            border: 1.5px solid #cfdad6; border-radius: 6px; font-size: 14px;
        }
        input:focus, select:focus { border-color: #2f7d6d; outline: none; }

        button {
            background: #2f7d6d; color: white; border: none; padding: 12px; margin-top: 25px;
            border-radius: 6px; cursor: pointer; width: 100%; font-size: 16px; font-weight: bold;
        }
        button:hover { background: #276b5d; }
        .error { background: #fbe9e5; color: #b3432f; padding: 8px; border-radius: 6px; font-size: 13px; margin-top: 10px; }
        .link { text-align: center; margin-top: 18px; font-size: 13px; color: #5d6f78; }
        .link a { color: #2f7d6d; font-weight: bold; text-decoration: none; }
    </style>
</head>
<body>
    <div class="card">
        <h2>Create your account</h2>
        <p class="sub">It takes less than a minute.</p>

        {% if error %}
            <div class="error">{{ error }}</div>
        {% endif %}

        <form method="POST">
            <label>Username</label>
            <input type="text" name="username" required>

            <label>Password</label>
            <input type="password" name="password" required>

            <label>Confirm password</label>
            <input type="password" name="confirm" required>

            <label>I am a</label>
            <select name="role">
                <option value="Student">Student</option>
                <option value="Mentor">Industry Mentor / Counselor</option>
            </select>

            <button type="submit">Create account</button>
        </form>

        <p class="link">Already have an account? <a href="/login">Log in</a></p>
    </div>
</body>
</html>
