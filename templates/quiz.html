<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aptitude Quiz - CareerPath AI</title>
    <style>
        :root {
            --bg-page: #f5f6ff;
            --bg-card: #ffffff;
            --primary: #6338f5;
            --primary-dark: #4923d4;
            --primary-soft: #ede9fe;
            --blue: #2563eb;
            --text-main: #181a31;
            --text-muted: #5a607f;
            --border-light: #e3e7f7;
            --shadow-card: 0 12px 32px rgba(28, 24, 84, 0.06);
        }

        * {
            box-sizing: border-box;
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            margin: 0;
            padding: 0;
        }

        body {
            background:
                radial-gradient(circle at 12% 8%, rgba(124, 58, 237, 0.14), transparent 36%),
                radial-gradient(circle at 88% 12%, rgba(37, 99, 235, 0.12), transparent 38%),
                var(--bg-page);
            color: var(--text-main);
            padding: 36px 18px 56px;
            min-height: 100vh;
        }

        .wrap {
            max-width: 740px;
            margin: auto;
        }

        .back-link {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            color: var(--primary);
            text-decoration: none;
            font-weight: 700;
            font-size: 0.9rem;
            background: #ffffff;
            border: 1px solid var(--border-light);
            padding: 8px 16px;
            border-radius: 999px;
            box-shadow: 0 4px 12px rgba(28, 24, 84, 0.05);
            margin-bottom: 18px;
            transition: all 0.18s ease;
        }

        .back-link:hover {
            border-color: var(--primary);
            transform: translateY(-1px);
        }

        h1 {
            color: var(--text-main);
            font-size: 2rem;
            font-weight: 800;
            letter-spacing: -0.02em;
            margin-bottom: 6px;
        }

        .sub {
            color: var(--text-muted);
            font-size: 0.95rem;
            margin-bottom: 24px;
        }

        .q {
            background: var(--bg-card);
            border: 1px solid var(--border-light);
            border-radius: 20px;
            padding: 22px 24px;
            margin-bottom: 16px;
            box-shadow: var(--shadow-card);
            position: relative;
            overflow: hidden;
        }

        .q::before {
            content: "";
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 3.5px;
            background: linear-gradient(90deg, #7c3aed, #4f46e5, #2563eb);
        }

        .q p {
            font-weight: 700;
            font-size: 1rem;
            color: var(--text-main);
            margin-bottom: 12px;
            line-height: 1.45;
        }

        .q label {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 10px 14px;
            margin-top: 8px;
            border-radius: 12px;
            border: 1px solid #edf0fb;
            background: #f9faff;
            color: var(--text-main);
            font-size: 0.92rem;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.18s ease;
        }

        .q label:hover {
            border-color: var(--primary);
            background: var(--primary-soft);
            color: var(--primary-dark);
        }

        .q input[type="radio"] {
            accent-color: var(--primary);
            width: 16px;
            height: 16px;
            cursor: pointer;
        }

        button[type="submit"] {
            background: linear-gradient(90deg, #6d28d9 0%, #4f46e5 55%, #2563eb 100%);
            color: #ffffff;
            border: none;
            padding: 14px 24px;
            margin-top: 10px;
            width: 100%;
            border-radius: 999px;
            font-size: 1rem;
            font-weight: 700;
            cursor: pointer;
            box-shadow: 0 12px 26px rgba(79, 70, 229, 0.32);
            transition: transform 0.18s ease, box-shadow 0.18s ease;
        }

        button[type="submit"]:hover {
            transform: translateY(-2px);
            box-shadow: 0 16px 32px rgba(79, 70, 229, 0.42);
        }

        @media (max-width: 600px) {
            .q {
                padding: 18px;
            }
            h1 {
                font-size: 1.65rem;
            }
        }
    </style>
</head>
<body>
    <div class="wrap">
        <a href="/student" class="back-link">&larr; Back to dashboard</a>
        <h1>Aptitude Quiz</h1>
        <p class="sub">Answer all {{ questions|length }} questions. Your score helps us match careers.</p>

        <form method="POST">
            {% for q in questions %}
                {% set qi = loop.index0 %}
                <div class="q">
                    <p>{{ loop.index }}. {{ q.question }}</p>
                    {% for opt in q.options %}
                        <label>
                            <input type="radio" name="q{{ qi }}" value="{{ opt }}" required> {{ opt }}
                        </label>
                    {% endfor %}
                </div>
            {% endfor %}
            <button type="submit">Submit quiz</button>
        </form>
    </div>
</body>
</html>
